[package]
name = "store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
model = { version = "0.2.0", path = "../model" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
# Trait bounds for the JSON helpers; already a dependency of model.
serde = { version = "1.0.229", default-features = false }
# Encodes a track's artists and thumbnails into one TEXT column each; already in the lockfile.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = "2.0.21"
