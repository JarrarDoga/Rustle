[package]
name = "ytm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
model = { version = "0.2.0", path = "../model" }
rustypipe = { version = "0.11.4", default-features = false, features = ["userdata", "rustls-tls-webpki-roots"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Already in the tree via rustypipe; strips cookies from its cache file, builds the visionOS request and loads fixtures.
serde_json = "1.0.138"
# Already in the tree via rustypipe; deserializes the visionOS player response.
serde = { version = "1.0.229", features = ["derive"] }
# Already in the tree via rustypipe; logs stream retries and lyrics fallbacks.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Already in the tree via rustypipe; sends the visionOS player and ANDROID_MUSIC timed-lyrics requests its ClientType lacks.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# Shows rustypipe's warnings (e.g. client fallbacks) when running the spike example.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
