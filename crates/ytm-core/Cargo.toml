[package]
name = "ytm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
model = { version = "0.1.0", path = "../model" }
rustypipe = { version = "0.11.4", default-features = false, features = ["userdata", "rustls-tls-webpki-roots"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
# Already in the tree via rustypipe; strips cookies from its cache file and loads fixtures.
serde_json = "1.0.138"

[dev-dependencies]
# Shows rustypipe's warnings (e.g. client fallbacks) when running the spike example.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
# Already in the tree via model; derives the recorded-search shape in tests.
serde = { version = "1.0.229", features = ["derive"] }
