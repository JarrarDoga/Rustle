[package]
name = "rustle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mimalloc = "0.1.52"
model = { version = "0.1.0", path = "../model" }
player = { version = "0.1.0", path = "../player" }
store = { version = "0.1.0", path = "../store" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ytm-core = { version = "0.1.0", path = "../ytm-core" }
# UI toolkit; glow backend only, no wgpu/accesskit to keep the binary and RSS small.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "clipboard"] }
# Same egui as eframe's, named directly by the views. No bundled fonts: the
# app embeds Inter and Phosphor (assets/fonts) instead.
egui = { version = "0.37.0", default-features = false }
# Cookie storage in the OS keyring (Secret Service via libdbus; no zbus/async stack).
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
# MPRIS for KDE's media applet and media keys; libdbus backend, a far smaller tree than zbus.
souvlaki = { version = "0.8.3", default-features = false, features = ["use_dbus"] }
# Already pulled in by souvlaki; used directly to wake its service loop after each update.
dbus = { version = "0.9", default-features = false }
# Thumbnail fetches on the thumbs worker threads; same build as the player crate's.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# Thumbnail decoding; only the formats YouTube serves, no rayon.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# The allocator under `mimalloc`; `extended` only adds `mi_collect`, which the thumbs workers call after each image.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

# RPM for Nobara/Fedora, built by packaging/build-rpm.sh (cargo-generate-rpm).
# The script copies rustypipe-botguard and its license into target/release/
# before this runs; the release profile already strips the binaries.
[package.metadata.generate-rpm]
summary = "Native YouTube Music desktop client"
assets = [
    { source = "target/release/rustle", dest = "/usr/bin/rustle", mode = "755" },
    { source = "../../packaging/rustle.desktop", dest = "/usr/share/applications/rustle.desktop", mode = "644" },
    { source = "../../packaging/rustle.svg", dest = "/usr/share/icons/hicolor/scalable/apps/rustle.svg", mode = "644" },
    { source = "target/release/rustypipe-botguard", dest = "/usr/libexec/rustle/rustypipe-botguard", mode = "755" },
    { source = "target/release/LICENSE.rustypipe-botguard", dest = "/usr/share/licenses/rustle/LICENSE.rustypipe-botguard", mode = "644", doc = true },
]
auto-req = "auto"
# No install scriptlets, so no /bin/sh dependency.
require-sh = false

[package.metadata.generate-rpm.requires]
yt-dlp = "*"
# eframe loads its Wayland window, keyboard and GL libraries with dlopen, so
# auto-req cannot see them. The X11 fallback's libraries stay optional.
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
