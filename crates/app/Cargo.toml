[package]
name = "rustle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mimalloc = "0.1.52"
model = { version = "0.1.0", path = "../model" }
player = { version = "0.1.0", path = "../player" }
store = { version = "0.1.0", path = "../store" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ytm-core = { version = "0.1.0", path = "../ytm-core" }
# UI toolkit; glow backend only, no wgpu/accesskit to keep the binary and RSS small.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "clipboard"] }
# Same egui as eframe's, named directly by the views. No bundled fonts: the
# app embeds Inter and Phosphor (assets/fonts) instead.
egui = { version = "0.37.0", default-features = false }
# Cookie storage in the OS keyring (Secret Service via libdbus; no zbus/async stack).
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
# MPRIS for KDE's media applet and media keys; libdbus backend, a far smaller tree than zbus.
souvlaki = { version = "0.8.3", default-features = false, features = ["use_dbus"] }
# Already pulled in by souvlaki; used directly to wake its service loop after each update.
dbus = { version = "0.9", default-features = false }
# Thumbnail fetches on the thumbs worker threads; same build as the player crate's.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# Thumbnail decoding; only the formats YouTube serves, no rayon.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# The allocator under `mimalloc`; `extended` only adds `mi_collect`, which the thumbs workers call after each image.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
